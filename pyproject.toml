[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gapsbi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "scikit-learn",
    "scipy",
    "sbi",
    "torch",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]