name: gapsbi_env

channels:
  - conda-forge

dependencies:
  - python=3.11

  # Core scientific stack
  - numpy
  - scipy
  - h5py
  - pandas
  - emcee

  # ML / SBI
  - pytorch
  - tensorboard
  - scikit-learn

  # Plotting / inspection
  - matplotlib

  # Development / testing
  - pytest

  # Nice utilities
  - tqdm
  - pyyaml
  - rich

  # Pip
  - pip

  # Pip-only packages
  - pip:
      - sbi
