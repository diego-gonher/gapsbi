# Validated top-level environment for the publication benchmark.
#
# This is intentionally a portable, solver-based specification rather than an
# osx-arm64-only explicit lock.  Exact low-level builds (BLAS, compiler and
# platform packages) are selected by conda for the target platform.
name: gapsbi_env

channels:
  - conda-forge

dependencies:
  - python=3.11.15
  - numpy=2.4.4
  - scipy=1.17.1
  - h5py=3.16.0
  - pandas=3.0.6
  - pytorch=2.10.0
  - scikit-learn=1.8.0
  - matplotlib=3.10.9
  - pytest=9.0.3
  - tqdm=4.67.3
  - pyyaml=6.0.3
  - rich=15.0.0
  - pip=26.1.1
  - pip:
      - emcee==3.1.6
      - sbi==0.26.1
      - tensorboard==2.20.0
