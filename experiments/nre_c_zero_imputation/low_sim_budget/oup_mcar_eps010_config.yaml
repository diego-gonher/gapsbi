dataset_path: data/canonical_v1/oup/mcar/oup_mcar_eps010_seed123.h5
problem: oup
output_dir: outputs_low_sim_budget/nre_c_zero_imputation/oup/mcar/oup_mcar_eps010
seeds: [101]
max_train_samples: 900
max_val_samples: 100
imputation:
  method: zero
nre:
  classifier: resnet
  device: cpu
  training_batch_size: 100
  stop_after_epochs: 20
  max_num_epochs: 5000
  num_classes: 5
  gamma: 1.0
evaluation:
  partial_reference_path: references/partial_data_references_v1/oup_mcar_eps010_references.h5
  # Smoke-test subset. Omit this key or pass --reference-indices 0 ... 9 for all references.
  reference_indices: [0, 1]
  grid_resolutions: [400, 800]
  selected_grid_resolution: 800
  grid_batch_size: 50000
  reference_metrics:
    c2st_max_samples_per_observation: 2000
    c2st_n_folds: 3
    c2st_hidden_layer_scale: 5
    c2st_max_iter: 10000
