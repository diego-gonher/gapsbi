dataset_path: data/canonical_v1/ricker/mcar/ricker_mcar_eps025_seed123.h5
problem: ricker
output_dir: outputs/npe_learned_imputation/ricker/mcar/ricker_npe_learned_imputation_mcar_eps025
seeds: [26485, 976532, 1172401, 512417, 8991732, 314159, 271828, 161803, 141421, 173205]

npe:
  density_estimator: nsf
  device: cpu
  training_batch_size: 256
  stop_after_epochs: 20
  max_num_epochs: 5000

imputer:
  lambda_recon: 1.0
  learning_rate: 0.001
  batch_size: 256
  max_num_epochs: 5000
  stop_after_epochs: 20
  imputer_type: auto
  hidden_dim: 128
  num_layers: 2
  dropout: 0.0

evaluation:
  test_sample: 1000
  num_posterior_samples: 1000
  num_alpha_grid: 101

sampling:
  reject_outside_prior: true
  max_sampling_time: 30.0
