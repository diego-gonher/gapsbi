dataset_path: data/canonical_v1/oup/mar/oup_mar_coordinate_increasing_eps050_seed123.h5
problem: oup
output_dir: outputs/npe_masked_attention/oup/mar/oup_mar_eps050
seeds: [26485, 976532, 1172401, 512417, 8991732, 314159, 271828, 161803, 141421, 173205]

npe:
  density_estimator: nsf
  z_score_x: none
  z_score_theta: independent
  device: cpu
  training_batch_size: 256
  stop_after_epochs: 20
  max_num_epochs: 5000

embedding:
  type: masked_attention
  token_dim: 32
  context_dim: 64
  num_heads: 2
  num_layers: 1
  ff_multiplier: 2
  mask_summary_dim: 16
  dropout: 0.0

evaluation:
  test_sample: 1000
  num_posterior_samples: 1000
  num_alpha_grid: 101

sampling:
  reject_outside_prior: true
  max_sampling_time: 30.0
