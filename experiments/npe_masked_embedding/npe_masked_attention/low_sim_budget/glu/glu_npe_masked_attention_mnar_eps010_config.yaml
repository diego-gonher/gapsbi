dataset_path: data/canonical_v1/glu/mnar/glu_mnar_self_censoring_identity_eps010_seed123.h5
problem: glu
output_dir: outputs_low_sim_budget/npe_masked_attention/glu/mnar/glu_mnar_eps010
seeds: [26485, 976532, 1172401, 512417, 8991732, 314159, 271828, 161803, 141421, 173205]
max_train_samples: 4500
max_val_samples: 500

npe:
  density_estimator: nsf
  z_score_x: none
  z_score_theta: independent
  device: cpu
  training_batch_size: 256
  stop_after_epochs: 20
  max_num_epochs: 5000

embedding:
  type: masked_attention
  token_dim: 32
  context_dim: 64
  num_heads: 2
  num_layers: 1
  ff_multiplier: 2
  mask_summary_dim: 16
  dropout: 0.0

evaluation:
  test_sample: 1000
  num_posterior_samples: 1000
  num_alpha_grid: 101

sampling:
  reject_outside_prior: true
  max_sampling_time: 30.0
